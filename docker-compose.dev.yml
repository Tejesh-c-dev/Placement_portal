version: '3.8'

# Development docker-compose - Use this for local development
# Runs only MongoDB and Redis, with hot-reload for backend and frontend

services:
  # MongoDB Database
  mongodb:
    image: mongo:6
    container_name: placement_mongodb_dev
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: placement_portal
    volumes:
      - mongodb_dev_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: placement_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data

  # MongoDB UI (optional - for database management)
  mongo-express:
    image: mongo-express:latest
    container_name: placement_mongo_express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb

volumes:
  mongodb_dev_data:
  redis_dev_data:
